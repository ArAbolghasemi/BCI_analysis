[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-analysis"
version = "0.1.0"
description = "Local utilities for BCI/BMI behavior analysis notebooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "richfile",
]

[tool.setuptools.packages.find]
where = ["src"]
